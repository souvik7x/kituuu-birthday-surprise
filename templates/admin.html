<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><main class="section"><div class="heading"><p class="eyebrow">PRIVATE CONTROL ROOM</p><h2>Website <em>dashboard</em></h2><a href="{{url_for('admin_logout')}}">Log out</a></div>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<div class="surprise-grid"><div class="surprise"><h3>Upload a photo</h3><form method="post" action="{{url_for('upload')}}" enctype="multipart/form-data"><input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp" required><button class="btn primary">Upload</button></form></div><div class="surprise"><h3>Add a message</h3><form method="post" action="{{url_for('add_message')}}"><input name="title" placeholder="Title" required><textarea name="body" rows="5" placeholder="Message" required></textarea><button class="btn primary">Save message</button></form></div></div><h3>Saved messages</h3>{% for m in messages %}<div class="promise"><b>{{m.title}}</b><span>{{m.body}}</span></div>{% endfor %}</main></body></html>
